<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="520" height="120" fill="none">
  <defs>
    <linearGradient id="ss-icon-grad-dark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#075E54"/>
      <stop offset="100%" stop-color="#25D366"/>
    </linearGradient>
  </defs>
  <!-- Icon: rounded square -->
  <rect x="0" y="0" width="120" height="120" rx="26" fill="url(#ss-icon-grad-dark)"/>
  <!-- Star accent top-right -->
  <polygon points="90,10 94,22 107,22 97,29 101,41 90,34 79,41 83,29 73,22 86,22" fill="rgba(255,255,255,0.45)"/>
  <!-- SS letters -->
  <text x="60" y="88" font-family="Arial Black,Arial,sans-serif" font-weight="900" font-size="68" text-anchor="middle" fill="white" letter-spacing="-3">SS</text>
  <!-- Wordmark: "Star" in white (dark mode) -->
  <text x="148" y="86" font-family="Arial Black,Arial,sans-serif" font-weight="900" font-size="72" fill="white" letter-spacing="-2">Star</text>
  <!-- Wordmark: "Sales" in bright green -->
  <text x="330" y="86" font-family="Arial Black,Arial,sans-serif" font-weight="900" font-size="72" fill="#25D366" letter-spacing="-2">Sales</text>
</svg>
